name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on critical advisories in production dependencies. Raise to `high` once
      # zod is on v4 (GHSA-mrhx-c7xc-m3w5 has no fix in the 3.x line).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage (95% threshold on src/domain)
        run: pnpm test:coverage

      # Catches build-only failures (server/client boundaries, route config) before merge.
      # Mock data mode means no database is needed; DATABASE_URL only has to be set.
      - name: Production build
        run: pnpm build
        env:
          USE_MOCK_DATA: "true"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NEXT_TELEMETRY_DISABLED: "1"

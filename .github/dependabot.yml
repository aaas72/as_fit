version: 2
updates:
  - package-ecosystem: npm # works with pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for patch/minor updates of the framework pair, so they never drift apart.
      nextjs:
        patterns: ["next", "eslint-config-next"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
